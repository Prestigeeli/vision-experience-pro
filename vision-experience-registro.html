<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | VISION EXPERIENCE PRO</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#292319,#080909 62%);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f1e6;display:grid;place-items:center;padding:22px}.panel{width:min(100%,460px);border:1px solid #8c7145;border-radius:18px;background:#121211;padding:32px 26px;box-shadow:0 20px 60px #0008}h1{font:normal 30px Georgia,serif;letter-spacing:.1em;color:#e3c387;text-align:center;margin:0} .sub{text-align:center;font-size:11px;letter-spacing:.15em;color:#c6ac80;margin:10px 0 28px}h2{text-align:center;font-size:20px;font-weight:500}label{display:block;margin:18px 0 7px;color:#e3d5bd;font-size:14px}input{width:100%;background:#20201f;border:1px solid #75664c;border-radius:9px;padding:13px;color:#fff;font-size:16px}input:focus{outline:2px solid #d5ae66}button{cursor:pointer;width:100%;border:0;border-radius:9px;background:#c6a36a;color:#17120c;font-weight:700;font-size:15px;padding:14px;margin-top:20px}button:disabled{opacity:.55;cursor:wait}.switch{background:none;color:#e7c994;border:1px solid #63533b;margin-top:12px}.message{margin-top:18px;padding:12px;border-radius:8px;display:none;line-height:1.5;white-space:pre-line}.message.ok{display:block;background:#163123;color:#d4f2dc}.message.err{display:block;background:#442024;color:#ffdddd}.note{color:#a9a298;font-size:12px;line-height:1.6;margin-top:22px;text-align:center}a{color:#e7c994}
</style></head><body><main class="panel"><h1>VISION EXPERIENCE PRO</h1><div class="sub">TU PROYECTO ANTES DE HACERLO REALIDAD</div><h2 id="heading">Crea tu cuenta</h2><form id="form"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required placeholder="tu@email.com"><label for="password">Contraseña (mínimo 8 caracteres)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button id="submit" type="submit">CREAR MI CUENTA</button></form><button id="switch" class="switch" type="button">Ya tengo cuenta · Iniciar sesión</button><button id="forgot" class="switch" type="button">Olvidé mi contraseña</button><div id="message" class="message" role="status" aria-live="polite"></div><p class="note">Tu cuenta es personal. No compartas tu contraseña. La generación de imágenes y los pagos todavía no están activos.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const PROJECT_URL='https://wvyjjrnoehhcqhmskmcj.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_8m4RlCuvEXWFBJrVd8NeEQ_a2_4v6rn';
const STUDIO='vision-experience-estudio-creditos-reales.html';
const $=id=>document.getElementById(id);
const msg=$('message'),btn=$('submit'),sw=$('switch'),forgot=$('forgot'),heading=$('heading'),pwd=$('password'),email=$('email');
let mode='signup', recoveryConfirmed=false;
function notice(t,isError=false){msg.textContent=t;msg.className='message '+(isError?'err':'ok')}
if(!window.supabase){notice('No se pudo cargar la conexión con Supabase.',true);btn.disabled=true;return}
const client=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function setMode(next){mode=next;msg.className='message';msg.textContent='';
  heading.textContent=next==='login'?'Inicia sesión':next==='signup'?'Crea tu cuenta':next==='request'?'Recupera tu contraseña':'Establece una contraseña nueva';
  btn.textContent=next==='login'?'ENTRAR':next==='signup'?'CREAR MI CUENTA':next==='request'?'ENVIAR CORREO DE RECUPERACIÓN':'GUARDAR CONTRASEÑA NUEVA';
  pwd.parentElement.querySelector('label').textContent=next==='reset'?'Contraseña nueva (mínimo 8 caracteres)':'Contraseña (mínimo 8 caracteres)';
  pwd.required=next!=='request';pwd.closest('form').querySelector('label[for="password"]').style.display=next==='request'?'none':'block';pwd.style.display=next==='request'?'none':'block';
  email.required=next!=='reset';email.style.display=next==='reset'?'none':'block';document.querySelector('label[for="email"]').style.display=next==='reset'?'none':'block';
  pwd.autocomplete=next==='login'?'current-password':'new-password';
  sw.textContent=next==='signup'?'Ya tengo cuenta · Iniciar sesión':'Volver a iniciar sesión';
  sw.style.display=next==='reset'?'none':'block';forgot.style.display=(next==='login'||next==='signup')?'block':'none';
}
sw.addEventListener('click',()=>setMode(mode==='signup'?'login':'login'));
forgot.addEventListener('click',()=>setMode('request'));
$('form').addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;notice('Procesando…');
  const address=email.value.trim(),password=pwd.value;
  try{
    if(mode==='login'){
      const {error}=await client.auth.signInWithPassword({email:address,password});if(error)throw error;
      notice('Acceso correcto. Abriendo tu estudio…');window.location.assign(STUDIO);return;
    }
    if(mode==='signup'){
      const {error}=await client.auth.signUp({email:address,password,options:{emailRedirectTo:new URL('vision-experience-registro.html',location.href).href}});if(error)throw error;
      notice('Revisa tu correo para confirmar tu cuenta. Si ya tienes una cuenta, utiliza Iniciar sesión.');return;
    }
    if(mode==='request'){
      const {error}=await client.auth.resetPasswordForEmail(address,{redirectTo:new URL('vision-experience-registro.html',location.href).href});if(error)throw error;
      notice('Si existe una cuenta para este correo, recibirás un enlace. Ábrelo desde el mismo navegador para establecer una contraseña nueva.');return;
    }
    if(mode==='reset'){
      if(!recoveryConfirmed){notice('Abre primero el enlace más reciente del correo de recuperación.',true);return}
      const {error}=await client.auth.updateUser({password});if(error)throw error;
      recoveryConfirmed=false;pwd.value='';setMode('login');notice('Contraseña actualizada. Ya puedes iniciar sesión con la nueva contraseña.');return;
    }
  }catch(err){notice('No se pudo completar la operación: '+(err.message||'Error desconocido'),true)}finally{btn.disabled=false}
});
client.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){recoveryConfirmed=true;setMode('reset');notice('Enlace verificado. Escribe tu contraseña nueva y pulsa Guardar.');}
});
// Supabase procesa los tokens del enlace de recuperación de forma asíncrona.
// Si la sesión ya existe, no redirigir: la recuperación requiere un cambio explícito de contraseña.
const hash=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);
if(hash.get('type')==='recovery'||query.get('type')==='recovery'){
  setMode('reset');notice('Validando el enlace de recuperación…');
}
setTimeout(async()=>{
  if(mode==='reset'&&!recoveryConfirmed){
    const {data}=await client.auth.getSession();
    if(data?.session){recoveryConfirmed=true;notice('Puedes establecer una contraseña nueva.');}
    else notice('No se pudo validar el enlace. Solicita uno nuevo desde «Olvidé mi contraseña».',true);
  }
},1200);
})();
</script></body></html>
