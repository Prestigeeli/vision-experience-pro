<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | VISION EXPERIENCE PRO</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#292319,#080909 62%);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f1e6;display:grid;place-items:center;padding:22px}.panel{width:min(100%,460px);border:1px solid #8c7145;border-radius:18px;background:#121211;padding:32px 26px;box-shadow:0 20px 60px #0008}h1{font:normal 30px Georgia,serif;letter-spacing:.1em;color:#e3c387;text-align:center;margin:0} .sub{text-align:center;font-size:11px;letter-spacing:.15em;color:#c6ac80;margin:10px 0 28px}h2{text-align:center;font-size:20px;font-weight:500}label{display:block;margin:18px 0 7px;color:#e3d5bd;font-size:14px}input{width:100%;background:#20201f;border:1px solid #75664c;border-radius:9px;padding:13px;color:#fff;font-size:16px}input:focus{outline:2px solid #d5ae66}button{cursor:pointer;width:100%;border:0;border-radius:9px;background:#c6a36a;color:#17120c;font-weight:700;font-size:15px;padding:14px;margin-top:20px}button:disabled{opacity:.55;cursor:wait}.switch{background:none;color:#e7c994;border:1px solid #63533b;margin-top:12px}.message{margin-top:18px;padding:12px;border-radius:8px;display:none;line-height:1.5;white-space:pre-line}.message.ok{display:block;background:#163123;color:#d4f2dc}.message.err{display:block;background:#442024;color:#ffdddd}.note{color:#a9a298;font-size:12px;line-height:1.6;margin-top:22px;text-align:center}a{color:#e7c994}
</style></head><body><main class="panel"><h1>VISION EXPERIENCE PRO</h1><div class="sub">TU PROYECTO ANTES DE HACERLO REALIDAD</div><h2 id="heading">Crea tu cuenta</h2><form id="form"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required placeholder="tu@email.com"><label for="password">Contraseña (mínimo 8 caracteres)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button id="submit" type="submit">CREAR MI CUENTA</button></form><button id="switch" class="switch" type="button">Ya tengo cuenta · Iniciar sesión</button><div id="message" class="message" role="status" aria-live="polite"></div><p class="note">Versión de prueba del registro. No incluye todavía generación de imágenes, créditos ni pagos. No introduzcas datos de pago.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
https://wvyjjrnoehhcqhmskmcj.supabase.co/rest/v1/
const PUBLISHABLE_KEY='sb_publishable_8m4RlCuvEXWFBJrVd8NeEQ_a2_4v6rn';
const msg=document.getElementById('message'),btn=document.getElementById('submit'),sw=document.getElementById('switch'),heading=document.getElementById('heading'),pwd=document.getElementById('password');
let login=false;
function notice(message,error=false){msg.textContent=message;msg.className='message '+(error?'err':'ok')}
if(!window.supabase){notice('No se pudo cargar la conexión. Comprueba tu conexión a Internet y vuelve a abrir esta página.',true);btn.disabled=true;return}
const client=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
sw.addEventListener('click',()=>{login=!login;heading.textContent=login?'Inicia sesión':'Crea tu cuenta';btn.textContent=login?'ENTRAR':'CREAR MI CUENTA';sw.textContent=login?'No tengo cuenta · Registrarme':'Ya tengo cuenta · Iniciar sesión';pwd.autocomplete=login?'current-password':'new-password';msg.className='message';msg.textContent=''});
document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();btn.disabled=true;notice('Procesando, espera un momento…');const email=document.getElementById('email').value.trim(),password=pwd.value;try{let result;if(login){result=await client.auth.signInWithPassword({email,password})}else{result=await client.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin+window.location.pathname}})}if(result.error)throw result.error;if(login){notice('Has iniciado sesión correctamente. Esta página es una prueba del registro; los créditos se configurarán más adelante.')}else{notice('Si el registro se ha aceptado, revisa tu correo y pulsa el enlace de confirmación. Comprueba también la carpeta de spam. Si ya existe una cuenta, Supabase puede mostrar un mensaje similar por privacidad.')}}catch(error){notice('No se pudo completar la operación: '+(error.message||'error desconocido'),true)}finally{btn.disabled=false}});
client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'){notice('Correo confirmado o sesión iniciada correctamente. El sistema de créditos se añadirá en otra etapa.')}});
})();
</script></body></html>
